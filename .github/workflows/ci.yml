name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build with the same image GitHub Pages itself uses to publish this
      # site, so CI checks exactly what gets deployed. This avoids compiling
      # the native gems from Gemfile.lock on the runner, which broke when the
      # runner's Ruby and compiler were updated (commonmarker 0.23.10 no
      # longer compiles there).
      - name: Build site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
